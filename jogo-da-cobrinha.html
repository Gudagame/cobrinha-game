<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cobrinha</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg-deep: #0f2027;
    --bg-mid: #1a3a2e;
    --grid-a: #163027;
    --grid-b: #123023;
    --snake-head: #9ee37d;
    --snake-body: #5fb85a;
    --snake-outline: #2f6d34;
    --food: #ff6b5e;
    --food-glow: #ff9d8a;
    --ink: #eafff0;
    --ink-dim: #9fc9ac;
    --panel: #10261e;
    --accent: #ffd166;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: radial-gradient(circle at 50% 0%, var(--bg-mid), var(--bg-deep) 70%);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--ink);
    overflow: hidden;
    touch-action: none;
    user-select: none;
  }

  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    height: 100%;
    padding: env(safe-area-inset-top, 14px) 14px calc(env(safe-area-inset-bottom, 14px) + 8px);
    max-width: 480px;
    margin: 0 auto;
  }

  header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 4px 10px;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .brand .dot {
    width: 12px; height: 12px;
    border-radius: 3px;
    background: var(--snake-head);
    box-shadow: 0 0 10px var(--snake-head);
  }

  .brand h1 {
    font-size: 1.15rem;
    margin: 0;
    letter-spacing: 0.5px;
    font-weight: 700;
  }

  .scores {
    display: flex;
    gap: 14px;
    font-size: 0.85rem;
    color: var(--ink-dim);
  }

  .scores b {
    display: block;
    font-size: 1.15rem;
    color: var(--accent);
    font-weight: 700;
  }

  .rank-btn {
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    width: 40px;
    height: 40px;
    font-size: 1.1rem;
    color: var(--ink);
    cursor: pointer;
    margin-left: 10px;
  }

  #ranking-panel {
    position: fixed;
    inset: 0;
    background: rgba(6, 14, 11, 0.92);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    padding: 20px;
  }

  #ranking-panel.hidden { display: none; }

  .rank-card {
    background: var(--panel);
    border-radius: 18px;
    padding: 22px;
    width: 100%;
    max-width: 320px;
    max-height: 80vh;
    overflow-y: auto;
  }

  .rank-card h3 {
    margin: 0 0 14px;
    font-size: 1.1rem;
  }

  .rank-list {
    list-style: none;
    margin: 0 0 16px;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .rank-list li {
    display: flex;
    justify-content: space-between;
    font-size: 0.9rem;
    color: var(--ink-dim);
    padding: 6px 8px;
    border-radius: 8px;
    background: rgba(255,255,255,0.03);
  }

  .rank-list li b { color: var(--ink); }

  .rank-close { width: 100%; }

  #board-wrap {
    position: relative;
    width: 100%;
    max-width: 400px;
    aspect-ratio: 1 / 1;
    border-radius: 18px;
    overflow: hidden;
    box-shadow:
      0 0 0 3px var(--grid-a),
      0 20px 40px rgba(0,0,0,0.45),
      inset 0 0 30px rgba(0,0,0,0.35);
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(10, 20, 16, 0.82);
    backdrop-filter: blur(2px);
    text-align: center;
    padding: 20px;
    transition: opacity 0.2s ease;
  }

  #overlay.hidden { display: none; }

  #overlay h2 {
    margin: 0;
    font-size: 1.5rem;
    color: var(--ink);
  }

  #overlay p {
    margin: 0;
    color: var(--ink-dim);
    font-size: 0.95rem;
    max-width: 260px;
    line-height: 1.4;
  }

  .btn {
    border: none;
    padding: 13px 30px;
    border-radius: 999px;
    font-size: 1rem;
    font-weight: 700;
    background: linear-gradient(180deg, var(--snake-head), var(--snake-body));
    color: #0e2115;
    box-shadow: 0 6px 0 var(--snake-outline), 0 10px 18px rgba(0,0,0,0.35);
    cursor: pointer;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }

  .btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 var(--snake-outline), 0 4px 10px rgba(0,0,0,0.35);
  }

  #controls {
    margin-top: 18px;
    display: grid;
    grid-template-columns: repeat(3, 62px);
    grid-template-rows: repeat(3, 62px);
    gap: 8px;
    justify-content: center;
  }

  .pad-btn {
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    font-size: 1.4rem;
    box-shadow: 0 3px 0 rgba(0,0,0,0.4);
    cursor: pointer;
  }

  .pad-btn:active {
    transform: translateY(2px);
    box-shadow: none;
    background: #17362a;
  }

  .pad-up    { grid-column: 2; grid-row: 1; }
  .pad-left  { grid-column: 1; grid-row: 2; }
  .pad-right { grid-column: 3; grid-row: 2; }
  .pad-down  { grid-column: 2; grid-row: 3; }
  .pad-mid   { grid-column: 2; grid-row: 2; visibility: hidden; }

  footer {
    margin-top: auto;
    padding-top: 10px;
    color: var(--ink-dim);
    font-size: 0.75rem;
    text-align: center;
  }

  @media (max-width: 340px) {
    .brand h1 { font-size: 1rem; }
    .scores { font-size: 0.75rem; }
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="brand">
      <div class="dot"></div>
      <h1>Cobrinha</h1>
    </div>
    <div class="scores">
      <div>Pontos<b id="score">0</b></div>
      <div>Recorde<b id="best">0</b></div>
    </div>
    <button id="ranking-btn" class="rank-btn" title="Ranking online">🏆</button>
  </header>

  <div id="board-wrap">
    <canvas id="game"></canvas>
    <div id="overlay">
      <h2 id="overlay-title">Toque para começar</h2>
      <p id="overlay-text">Use as setas do teclado ou os botões abaixo para guiar a cobrinha até a comida.</p>
      <button class="btn" id="start-btn">Jogar</button>
    </div>
  </div>

  <div id="controls">
    <div class="pad-btn pad-up" data-dir="up">▲</div>
    <div class="pad-btn pad-left" data-dir="left">◀</div>
    <div class="pad-btn pad-mid"></div>
    <div class="pad-btn pad-right" data-dir="right">▶</div>
    <div class="pad-btn pad-down" data-dir="down">▼</div>
  </div>

  <footer>Deslize na tela ou use os botões · Pausar: toque no tabuleiro</footer>
</div>

<div id="ranking-panel" class="hidden">
  <div class="rank-card">
    <h3>Ranking online</h3>
    <ul class="rank-list" id="rank-list"><li>Carregando...</li></ul>
    <button class="btn rank-close" id="rank-close-btn">Fechar</button>
  </div>
</div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayText = document.getElementById('overlay-text');
  const startBtn = document.getElementById('start-btn');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const rankBtn = document.getElementById('ranking-btn');
  const rankPanel = document.getElementById('ranking-panel');
  const rankList = document.getElementById('rank-list');
  const rankCloseBtn = document.getElementById('rank-close-btn');

  // --- Configuração do Supabase ---
  // Troque pelos dados do seu projeto (Project Settings > API no painel do Supabase)
  const SUPABASE_URL = 'COLE_AQUI_SUA_URL_DO_PROJETO';
  const SUPABASE_ANON_KEY = 'COLE_AQUI_SUA_CHAVE_ANON';
  let supabase = null;
  if (window.supabase && SUPABASE_URL.startsWith('http')) {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }

  async function fetchTopScores() {
    if (!supabase) {
      rankList.innerHTML = '<li>Configure o Supabase no código para ativar o ranking online.</li>';
      return;
    }
    rankList.innerHTML = '<li>Carregando...</li>';
    const { data, error } = await supabase
      .from('scores')
      .select('player_name, score')
      .order('score', { ascending: false })
      .limit(10);
    if (error) {
      rankList.innerHTML = '<li>Não foi possível carregar o ranking.</li>';
      return;
    }
    if (!data.length) {
      rankList.innerHTML = '<li>Ninguém pontuou ainda. Seja o primeiro!</li>';
      return;
    }
    rankList.innerHTML = data
      .map(row => '<li><span>' + row.player_name + '</span><b>' + row.score + '</b></li>')
      .join('');
  }

  async function saveScoreOnline(finalScore) {
    if (!supabase || finalScore <= 0) return;
    const name = prompt('Novo recorde local! Digite seu nome para o ranking online:', '');
    if (!name) return;
    await supabase.from('scores').insert({ player_name: name.slice(0, 20), score: finalScore });
    fetchTopScores();
  }

  rankBtn.addEventListener('click', () => {
    rankPanel.classList.remove('hidden');
    fetchTopScores();
  });
  rankCloseBtn.addEventListener('click', () => {
    rankPanel.classList.add('hidden');
  });

  const GRID = 18;
  let cell = 0;
  let dpr = Math.max(1, window.devicePixelRatio || 1);

  let snake, dir, nextDir, food, score, best, running, gameLoop, speedMs;

  best = parseInt(localStorage.getItem('cobrinha_best') || '0', 10);
  bestEl.textContent = best;

  function resize() {
    const wrap = document.getElementById('board-wrap');
    const size = wrap.clientWidth;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    cell = (size * dpr) / GRID;
    draw();
  }
  window.addEventListener('resize', resize);

  function resetState() {
    const mid = Math.floor(GRID / 2);
    snake = [
      { x: mid - 1, y: mid },
      { x: mid - 2, y: mid },
      { x: mid - 3, y: mid }
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    speedMs = 145;
    scoreEl.textContent = score;
    placeFood();
  }

  function placeFood() {
    let pos;
    do {
      pos = {
        x: Math.floor(Math.random() * GRID),
        y: Math.floor(Math.random() * GRID)
      };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    food = pos;
  }

  function roundedRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    const size = canvas.width;
    ctx.clearRect(0, 0, size, size);

    // grid background checker
    for (let y = 0; y < GRID; y++) {
      for (let x = 0; x < GRID; x++) {
        ctx.fillStyle = (x + y) % 2 === 0 ? getVar('--grid-a') : getVar('--grid-b');
        ctx.fillRect(x * cell, y * cell, cell, cell);
      }
    }

    if (!snake) return;

    // food
    const fx = food.x * cell + cell / 2;
    const fy = food.y * cell + cell / 2;
    const grad = ctx.createRadialGradient(fx, fy, cell * 0.05, fx, fy, cell * 0.55);
    grad.addColorStop(0, getVar('--food-glow'));
    grad.addColorStop(1, getVar('--food'));
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(fx, fy, cell * 0.36, 0, Math.PI * 2);
    ctx.fill();

    // snake body
    for (let i = snake.length - 1; i >= 0; i--) {
      const seg = snake[i];
      const isHead = i === 0;
      const px = seg.x * cell;
      const py = seg.y * cell;
      const pad = cell * 0.08;
      ctx.fillStyle = isHead ? getVar('--snake-head') : getVar('--snake-body');
      roundedRect(px + pad, py + pad, cell - pad * 2, cell - pad * 2, cell * 0.28);
      ctx.fill();
      ctx.strokeStyle = getVar('--snake-outline');
      ctx.lineWidth = Math.max(1, cell * 0.04);
      ctx.stroke();

      if (isHead) {
        // eyes
        ctx.fillStyle = '#0e2115';
        const eyeOffsetX = dir.x !== 0 ? cell * 0.28 : cell * 0.18;
        const eyeOffsetY = dir.y !== 0 ? cell * 0.28 : cell * 0.18;
        const cx = px + cell / 2;
        const cy = py + cell / 2;
        const r = cell * 0.07;
        if (dir.x !== 0) {
          ctx.beginPath();
          ctx.arc(cx + dir.x * eyeOffsetX, cy - cell * 0.18, r, 0, Math.PI * 2);
          ctx.arc(cx + dir.x * eyeOffsetX, cy + cell * 0.18, r, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.arc(cx - cell * 0.18, cy + dir.y * eyeOffsetY, r, 0, Math.PI * 2);
          ctx.arc(cx + cell * 0.18, cy + dir.y * eyeOffsetY, r, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
  }

  function getVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function step() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // wall collision
    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
      return endGame();
    }
    // self collision
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      return endGame();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      placeFood();
      speedMs = Math.max(70, speedMs - 2.5);
      restartLoop();
    } else {
      snake.pop();
    }

    draw();
  }

  function restartLoop() {
    clearInterval(gameLoop);
    gameLoop = setInterval(step, speedMs);
  }

  function startGame() {
    resetState();
    running = true;
    overlay.classList.add('hidden');
    resize();
    restartLoop();
  }

  function endGame() {
    running = false;
    clearInterval(gameLoop);
    if (score > best) {
      best = score;
      localStorage.setItem('cobrinha_best', best);
      bestEl.textContent = best;
      saveScoreOnline(score);
    }
    overlayTitle.textContent = 'Fim de jogo';
    overlayText.textContent = 'Você fez ' + score + ' ponto' + (score === 1 ? '' : 's') + '. Toque para jogar de novo.';
    startBtn.textContent = 'Jogar novamente';
    overlay.classList.remove('hidden');
    draw();
  }

  function togglePause() {
    if (!snake) return;
    if (running) {
      running = false;
      clearInterval(gameLoop);
      overlayTitle.textContent = 'Pausado';
      overlayText.textContent = 'Toque para continuar de onde parou.';
      startBtn.textContent = 'Continuar';
      overlay.classList.remove('hidden');
    } else {
      running = true;
      overlay.classList.add('hidden');
      restartLoop();
    }
  }

  function setDirection(newDir) {
    if (!running) return;
    // impede virar 180 graus
    if (newDir.x === -dir.x && newDir.y === -dir.y) return;
    if (newDir.x === dir.x && newDir.y === dir.y) return;
    nextDir = newDir;
  }

  startBtn.addEventListener('click', () => {
    if (startBtn.textContent === 'Continuar') {
      togglePause();
    } else {
      startGame();
    }
  });

  document.getElementById('board-wrap').addEventListener('click', (e) => {
    if (e.target.closest('#overlay')) return;
    togglePause();
  });

  document.querySelectorAll('.pad-btn[data-dir]').forEach(btn => {
    btn.addEventListener('click', () => {
      const map = {
        up: { x: 0, y: -1 },
        down: { x: 0, y: 1 },
        left: { x: -1, y: 0 },
        right: { x: 1, y: 0 }
      };
      setDirection(map[btn.dataset.dir]);
    });
  });

  document.addEventListener('keydown', (e) => {
    const map = {
      ArrowUp: { x: 0, y: -1 },
      ArrowDown: { x: 0, y: 1 },
      ArrowLeft: { x: -1, y: 0 },
      ArrowRight: { x: 1, y: 0 },
      w: { x: 0, y: -1 },
      s: { x: 0, y: 1 },
      a: { x: -1, y: 0 },
      d: { x: 1, y: 0 }
    };
    if (map[e.key]) {
      e.preventDefault();
      setDirection(map[e.key]);
    }
    if (e.key === ' ') {
      e.preventDefault();
      togglePause();
    }
  });

  // swipe support
  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });

  canvas.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) {
      touchStart = null;
      return; // trata como toque simples (pausa), já tratado pelo click
    }
    if (Math.abs(dx) > Math.abs(dy)) {
      setDirection({ x: dx > 0 ? 1 : -1, y: 0 });
    } else {
      setDirection({ x: 0, y: dy > 0 ? 1 : -1 });
    }
    touchStart = null;
  }, { passive: true });

  resize();
  draw();
})();
</script>
</body>
</html>
