<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Reino das Patinhas: A Última Defesa</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Reino das Patinhas: A Última Defesa">
<meta property="og:description" content="Tower Defense 3D educativo: proteja o Santuário com Dash, Bolt, Pino e Luna e aprenda a cuidar de cães e gatos.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
/* ==================== TEMA ==================== */
:root{
  --ink:#2b2140; --ink-2:#5a4d75; --cream:#fff8ee; --paper:#ffffff;
  --orange:#ff8a3d; --pink:#ff5c8a; --teal:#2ec4b6; --purple:#7b5cff; --yellow:#ffd23f; --green:#43c463; --red:#ff4d5e; --blue:#3fa7ff;
  --panel:rgba(255,248,238,.96); --panel-dark:rgba(43,33,64,.88); --shadow:0 6px 0 rgba(43,33,64,.18), 0 10px 30px rgba(43,33,64,.25);
  --radius:18px; --lift:0px; --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px); --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --font-title:'Baloo 2', 'Trebuchet MS', system-ui, sans-serif; --font:'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#2b2140;color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,[tabindex]:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#c3d{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none;outline:none}

/* ==================== BOTÕES ==================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;padding:.7em 1.15em;border-radius:14px;background:var(--orange);color:#fff;font-family:var(--font-title);font-weight:800;font-size:1.05rem;letter-spacing:.2px;box-shadow:0 4px 0 #c75e1c;transition:transform .08s, filter .15s;min-height:44px;text-shadow:0 1px 0 rgba(0,0,0,.15)}
.btn:hover{filter:brightness(1.06)} .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c75e1c}
.btn.pink{background:var(--pink);box-shadow:0 4px 0 #c43461}.btn.teal{background:var(--teal);box-shadow:0 4px 0 #1b8f84}.btn.purple{background:var(--purple);box-shadow:0 4px 0 #5539c9}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 #d9cbb8}.btn.green{background:var(--green);box-shadow:0 4px 0 #2a9046}.btn.red{background:var(--red);box-shadow:0 4px 0 #b52a39}
.btn[disabled]{filter:grayscale(.8) brightness(.95);opacity:.6;cursor:not-allowed;transform:none}
.btn.small{padding:.45em .8em;font-size:.9rem;min-height:36px;border-radius:11px}
.btn.block{width:100%}

/* ==================== HUD ==================== */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud[hidden]{display:none}
.hud-top{position:absolute;top:calc(8px + var(--safe-t));left:calc(8px + var(--safe-l));right:calc(8px + var(--safe-r));display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--panel);padding:6px 12px;border-radius:999px;font-weight:800;font-size:1rem;box-shadow:var(--shadow);min-height:38px;white-space:nowrap}
.pill b{font-family:var(--font-title);font-size:1.1rem}
.pill.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.18)}}
.energy .bar{width:70px;height:12px;border-radius:8px;background:#e9dfd0;overflow:hidden}
.energy .bar i{display:block;height:100%;width:50%;background:linear-gradient(90deg,var(--yellow),var(--orange));transition:width .2s}
.spacer{flex:1}
.hbtn{pointer-events:auto;width:42px;height:42px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);font-weight:800;font-size:1.05rem;display:grid;place-items:center}
.hbtn:active{transform:scale(.94)}
#bossBar{position:absolute;top:calc(58px + var(--safe-t));left:50%;transform:translateX(-50%);width:min(440px,86vw);background:var(--panel-dark);color:#fff;border-radius:14px;padding:6px 12px 8px;box-shadow:var(--shadow);text-align:center}
#bossBar[hidden]{display:none}
#bossBar .nm{font-family:var(--font-title);font-weight:800;font-size:1rem}
#bossBar .hp{height:12px;border-radius:8px;background:#ffffff30;overflow:hidden;margin-top:4px}
#bossBar .hp i{display:block;height:100%;background:linear-gradient(90deg,#ff4d5e,#ff9f43);width:100%;transition:width .15s}
#speech{position:absolute;left:calc(10px + var(--safe-l));top:calc(64px + var(--safe-t));max-width:min(420px,76vw);display:flex;gap:10px;align-items:flex-start;background:var(--panel);padding:10px 14px;border-radius:16px 16px 16px 4px;box-shadow:var(--shadow);animation:pop .25s ease-out}
#speech[hidden]{display:none}
#speech .av{flex:none}
#speech p{margin:0;font-size:.95rem;line-height:1.3}
#speech p b{font-family:var(--font-title)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:1.35rem;border:3px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.av-dash{background:#c47a45}.av-bolt{background:#f3d9a8}.av-pino{background:#3d2a1e}.av-luna{background:#dfe8ff}

.hud-bottom{position:absolute;left:calc(8px + var(--safe-l));right:calc(8px + var(--safe-r));bottom:calc(8px + var(--safe-b) + var(--lift));display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;justify-content:space-between}
#heroBar,#itemBar{display:flex;gap:6px;pointer-events:auto}
.hero-btn{position:relative;width:64px;height:70px;border-radius:16px;background:var(--panel);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;overflow:hidden;padding-top:2px}
.hero-btn .avatar{width:36px;height:36px;font-size:1.15rem;border-width:2px}
.hero-btn .nm{font-family:var(--font-title);font-weight:800;font-size:.78rem;line-height:1}
.hero-btn .cost{font-size:.68rem;font-weight:800;color:var(--ink-2)}
.hero-btn .cd{position:absolute;inset:0;background:conic-gradient(rgba(43,33,64,.62) var(--p,0%), transparent 0);pointer-events:none;display:grid;place-items:center;color:#fff;font-weight:800;font-family:var(--font-title);font-size:1.2rem;text-shadow:0 1px 2px #000}
.hero-btn.noenergy{filter:grayscale(.7)}
.hero-btn.ready{animation:glow 1.6s infinite}
.hero-btn .key{position:absolute;top:3px;left:5px;font-size:.62rem;font-weight:800;opacity:.55}
@keyframes glow{50%{box-shadow:0 0 0 3px var(--yellow),var(--shadow)}}
.item-btn{position:relative;width:48px;height:48px;border-radius:14px;background:var(--panel);box-shadow:var(--shadow);font-size:1.4rem;display:grid;place-items:center}
.item-btn span{position:absolute;right:3px;bottom:1px;font-size:.72rem;font-weight:800;background:var(--ink);color:#fff;border-radius:8px;padding:0 5px}
.item-btn[disabled]{opacity:.4}
#bWave{pointer-events:auto;min-width:168px;flex-direction:column;gap:0;line-height:1.05;padding:.55em 1em}
#bWave small{display:block;font-family:var(--font);font-size:.72rem;font-weight:800;opacity:.95;margin-top:3px;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pulse{animation:pulse 1.1s infinite}
@keyframes pulse{50%{transform:scale(1.07);box-shadow:0 0 0 6px rgba(255,210,63,.65),0 4px 0 #c75e1c}}

/* ==================== PAINEL INFERIOR (construção / torre) ==================== */
.sheet{position:fixed;z-index:8;left:50%;transform:translateX(-50%);bottom:calc(88px + var(--safe-b) + var(--lift));width:min(620px,calc(100vw - 16px));max-height:min(62vh,520px);overflow:auto;background:var(--panel);border-radius:22px;box-shadow:var(--shadow);padding:12px 14px 14px;animation:sheetIn .2s ease-out}
.sheet[hidden]{display:none}
@keyframes sheetIn{from{transform:translate(-50%,20px);opacity:0}}
.sheet h3{margin:0;font-family:var(--font-title);font-size:1.2rem;display:flex;align-items:center;gap:8px}
.sheet .x{margin-left:auto;width:36px;height:36px;border-radius:50%;background:#efe4d4;font-weight:800}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:7px;margin-top:10px}
.tcard{position:relative;background:#fff;border-radius:14px;padding:7px 4px 6px;text-align:center;box-shadow:0 3px 0 #e2d5c2;border:2px solid transparent}
.tcard .ic{font-size:1.65rem;line-height:1.1}
.tcard .nm{font-weight:800;font-size:.74rem;line-height:1.1;min-height:2.2em;display:flex;align-items:center;justify-content:center}
.tcard .co{font-family:var(--font-title);font-weight:800;font-size:.9rem}
.tcard.sel{border-color:var(--orange);background:#fff3e6}
.tcard.poor .co{color:var(--red)}
.tcard.locked{opacity:.5}
.tdetail{margin-top:10px;background:#fff;border-radius:14px;padding:10px 12px;font-size:.9rem;line-height:1.35}
.tdetail .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.stat{background:#f6eee2;border-radius:10px;padding:3px 8px;font-weight:800;font-size:.8rem}
.stat.up{background:#dff7e5;color:#1d7a3a}
.lesson{background:#eaf6ff;border-left:4px solid var(--blue);padding:7px 10px;border-radius:8px;margin-top:8px;font-size:.86rem}
.syn{background:#fff0f6;border-left:4px solid var(--pink);padding:5px 10px;border-radius:8px;margin-top:6px;font-size:.82rem}
.modes{display:flex;gap:4px;flex-wrap:wrap}
.modes button{padding:4px 9px;border-radius:9px;background:#efe4d4;font-weight:800;font-size:.78rem;min-height:32px}
.modes button.on{background:var(--purple);color:#fff}
.lvl{color:var(--orange);letter-spacing:1px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hpbar{height:8px;border-radius:6px;background:#eadfcf;overflow:hidden;margin-top:4px}
.hpbar i{display:block;height:100%;background:var(--green)}

/* ==================== TOASTS & FLUTUANTES ==================== */
#toasts{position:fixed;z-index:20;top:calc(110px + var(--safe-t));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:min(92vw,520px)}
.toast{background:var(--panel-dark);color:#fff;padding:8px 16px;border-radius:999px;font-weight:800;font-size:.95rem;box-shadow:var(--shadow);animation:toast 2.8s forwards;text-align:center}
.toast.gold{background:linear-gradient(90deg,#ff8a3d,#ffb347)}.toast.pink{background:linear-gradient(90deg,#ff5c8a,#b388ff)}.toast.teal{background:linear-gradient(90deg,#2ec4b6,#3fa7ff)}
@keyframes toast{0%{transform:translateY(-10px) scale(.9);opacity:0}10%{transform:none;opacity:1}85%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
#floaters{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.fl{position:absolute;left:0;top:0;font-family:var(--font-title);font-weight:800;font-size:15px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.45),0 0 4px rgba(0,0,0,.4);white-space:nowrap;will-change:transform}
.fl.coin{color:#ffe066}.fl.big{font-size:20px;color:#ffd23f}.fl.bad{color:#ff7b8a}.fl.heal{color:#7dffa1}.fl.info{color:#cfe8ff;font-size:13px}

/* ==================== MODAIS ==================== */
.overlay{position:fixed;inset:0;z-index:30;background:rgba(30,20,50,.55);display:grid;place-items:center;padding:16px;backdrop-filter:blur(3px)}
.overlay[hidden]{display:none}
.mcard{width:min(560px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--cream);border-radius:24px;box-shadow:var(--shadow);padding:18px 18px 16px;animation:pop .22s ease-out;user-select:text;-webkit-user-select:text}
.mcard h2{margin:0 0 6px;font-family:var(--font-title);font-size:1.45rem;line-height:1.15;display:flex;align-items:center;gap:10px}
.mcard p{line-height:1.45;margin:.4em 0}
.chip{display:inline-block;background:var(--purple);color:#fff;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:800}
.chip.orange{background:var(--orange)}.chip.teal{background:var(--teal)}.chip.pink{background:var(--pink)}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;background:#fff;border-radius:14px;padding:11px 12px;box-shadow:0 3px 0 #e2d5c2;font-weight:700;font-size:1rem;line-height:1.25;border:2px solid transparent;min-height:48px}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#efe4d4;font-family:var(--font-title);font-weight:800}
.opt:hover:not([disabled]){border-color:var(--orange)}
.opt.ok{background:#dff7e5;border-color:var(--green)}.opt.ok .l{background:var(--green);color:#fff}
.opt.no{background:#ffe3e6;border-color:var(--red)}.opt.no .l{background:var(--red);color:#fff}
.opt[disabled]{cursor:default}
.explain{margin-top:12px;background:#fff;border-radius:14px;padding:10px 12px;border-left:5px solid var(--teal)}
.reward{font-weight:800;color:#1d7a3a}
.list{margin:.3em 0;padding-left:1.2em;line-height:1.45}
.weak{background:#fff3c4;border-radius:12px;padding:8px 12px;margin-top:8px;font-weight:700}
.stars{font-size:2.4rem;letter-spacing:4px;text-align:center;margin:6px 0}
.stars span{display:inline-block;animation:starIn .5s both}
.stars span:nth-child(2){animation-delay:.25s}.stars span:nth-child(3){animation-delay:.5s}
@keyframes starIn{from{transform:scale(0) rotate(-90deg);opacity:0}}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.kv{background:#fff;border-radius:12px;padding:8px 10px;font-weight:700;font-size:.92rem}
.kv b{display:block;font-family:var(--font-title);font-size:1.25rem}
.tip{background:#fff;border-radius:12px;padding:8px 12px;margin:6px 0;display:flex;gap:8px;align-items:flex-start;font-weight:700}
.disclaimer{font-size:.82rem;color:var(--ink-2);margin-top:10px;text-align:center}

/* ==================== TELAS (MENU) ==================== */
.screen{position:fixed;inset:0;z-index:25;overflow:auto;padding:calc(14px + var(--safe-t)) calc(14px + var(--safe-r)) calc(18px + var(--safe-b) + var(--lift)) calc(14px + var(--safe-l));background:linear-gradient(180deg,rgba(43,33,64,.25),rgba(43,33,64,.55))}
.screen[hidden]{display:none}
.wrap{max-width:980px;margin:0 auto}
.logo{text-align:center;color:#fff;margin:6px 0 10px;text-shadow:0 4px 0 rgba(43,33,64,.5)}
.logo h1{font-family:var(--font-title);font-weight:800;font-size:clamp(2rem,7vw,3.6rem);line-height:.95;margin:0;letter-spacing:1px;background:linear-gradient(180deg,#fff7c2,#ffd23f 55%,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #6b2f8a)}
.logo h1 small{display:block;font-size:.5em;letter-spacing:3px;-webkit-text-fill-color:#fff;color:#fff}
.logo p{margin:.5em 0 0;font-weight:800;font-size:clamp(.95rem,2.6vw,1.15rem)}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:14px}
.mbtn{background:var(--panel);border-radius:20px;padding:14px;box-shadow:var(--shadow);text-align:left;display:flex;gap:12px;align-items:center;min-height:74px;transition:transform .1s}
.mbtn:hover{transform:translateY(-2px)} .mbtn:active{transform:translateY(2px)}
.mbtn .ic{font-size:2rem;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none}
.mbtn b{display:block;font-family:var(--font-title);font-size:1.12rem;line-height:1.1}
.mbtn small{display:block;color:var(--ink-2);font-weight:700;font-size:.8rem;line-height:1.25;margin-top:2px}
.mbtn.main{grid-column:1/-1;background:linear-gradient(135deg,#ff8a3d,#ff5c8a);color:#fff}
.mbtn.main small{color:#fff}
.topbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.topbar h2{margin:0;color:#fff;font-family:var(--font-title);font-size:1.6rem;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.panel{background:var(--panel);border-radius:20px;padding:14px;box-shadow:var(--shadow);margin-bottom:10px}
.worlds{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.wcard{background:var(--panel);border-radius:20px;padding:14px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:6px}
.wcard .hd{display:flex;align-items:center;gap:10px}
.wcard .num{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-family:var(--font-title);font-weight:800;color:#fff;font-size:1.3rem}
.wcard b{font-family:var(--font-title);font-size:1.15rem}
.wcard.locked{opacity:.55}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ccard{background:#fff;border-radius:16px;padding:10px;box-shadow:0 3px 0 #e2d5c2;text-align:center;min-height:150px;display:flex;flex-direction:column;align-items:center;gap:4px}
.ccard .ic{font-size:2.2rem}
.ccard b{font-family:var(--font-title);font-size:.98rem;line-height:1.1}
.ccard small{font-size:.74rem;color:var(--ink-2);font-weight:700}
.ccard.locked{background:#e8dfd2;color:#9b8f80}
.ccard.locked .ic{filter:grayscale(1) opacity(.4)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th,.tbl td{padding:6px 8px;text-align:left;border-bottom:1px solid #eadfcf}
.tbl th{font-family:var(--font-title)}
.ach{display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:8px 12px;margin:6px 0}
.ach .ic{font-size:1.6rem}
.ach.locked{opacity:.45;filter:grayscale(1)}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eadfcf;font-weight:800}
.set select,.set input[type=text]{font:inherit;padding:6px 10px;border-radius:10px;border:2px solid #e2d5c2;background:#fff;min-height:40px}
.toggle{width:58px;height:32px;border-radius:999px;background:#d9cbb8;position:relative;flex:none}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.toggle[aria-checked=true]{background:var(--green)}
.toggle[aria-checked=true]::after{left:29px}
.hero-card{background:#fff;border-radius:18px;padding:12px;box-shadow:0 3px 0 #e2d5c2}
.hero-card .hd{display:flex;gap:10px;align-items:center}
.hero-card .avatar{width:56px;height:56px;font-size:1.8rem}
.cos{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cos button{background:#f6eee2;border-radius:12px;padding:6px 9px;font-weight:800;font-size:.82rem;min-height:38px;border:2px solid transparent}
.cos button.on{border-color:var(--purple);background:#efe9ff}
.badge{display:inline-flex;align-items:center;gap:4px;background:var(--panel);border-radius:999px;padding:6px 12px;font-weight:800;box-shadow:var(--shadow)}
#loading{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#5b3f9a,#2b2140);color:#fff;text-align:center;padding:20px}
#loading .paw{font-size:4rem;animation:bounce 1s infinite}
@keyframes bounce{50%{transform:translateY(-14px)}}
#loading[hidden]{display:none}


.tcard .cat{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.3px}
.tcard .rec{position:absolute;top:3px;right:4px;font-size:.9rem}
.tcard .air{position:absolute;top:3px;left:4px;font-size:.75rem;opacity:.8}
.barsg{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;align-items:center;font-size:.8rem;font-weight:800;margin:8px 0}
.pips i{display:inline-block;width:16px;height:9px;border-radius:5px;background:#eadfcf;margin-right:3px}

      for (const s of [-1, 1]) for (const k of [-0.5, 0.5]) put(body, mesh(G_BOX(0.04, 0.04, r * 0.9), mat(0x2b1d14)), k * r, r * 0.35, s * r * 0.75).rotation.x = s * 0.6;

      break;
    case 'box': core = put(body, mesh(G_BOX(1, 1, 1), bm), 0, r * 0.9, 0, r * 1.6, r * 1.5, r * 1.6); break;
    case 'spiky': core = put(body, mesh(geo('ico', () => new THREE.IcosahedronGeometry(1, 0)), bm), 0, r, 0, r * 1.05); break;
    case 'ghost': core = put(body, mesh(G_SPH(1, 10, 8), bm), 0, r * 1.1, 0, r);
      put(body, mesh(G_CONE(1, 1, 10), bm), 0, r * 0.4, 0, r, r * 1.1, r).rotation.x = Math.PI; break;

  }

  if (isBoss) {
    const aura = put(g, mesh(geo('aura', () => new THREE.TorusGeometry(1, 0.06, 4, 28)), mat(def.color, { emissive: def.color, emissiveIntensity: 0.9, transparent: true, opacity: 0.7 }), false), 0, 0.1, 0, r * 1.5);
    aura.rotation.x = Math.PI / 2; g.userData.aura = aura;

function genWaves(r, n, bossKey, mods, tier) {
  const pool = Object.keys(D.enemies).filter(k => k !== 'chefeHorda');
  const out = [];
  for (let i = 1; i <= n; i++) {
    const groups = []; const ng = i < 3 ? 2 : 3;
    for (let k = 0; k < ng; k++) { const t = pool[Math.floor(r() * pool.length)]; const def = D.enemies[t]; const cnt = Math.max(1, Math.round((3 + i * 1.3) * Math.sqrt(30 / def.hp) * 1.5)); groups.push(`${t}:${cnt}:${clamp(0.35 + def.hp / 220, 0.35, 2.4).toFixed(2)}`); }
    if (i >= Math.ceil(n * 0.6) && r() < 0.6) groups.push(`chefeHorda:${1 + (tier > 1 ? 1 : 0)}:5`);
    if (mods.includes('pulgas')) groups.push(`pulga:${6 + i}:0.4`);
    if (mods.includes('voadores') && i % 2 === 0) groups.push(`${r() < 0.5 ? 'mosquito' : 'fogos'}:${4 + i}:0.6`);
    if (i === n) groups.unshift(`${bossKey}:1:1`);
    out.push(groups.join(', '));
  }
  return out;
}

function update(dt) {

  for (const id in G.heroCd) G.heroCd[id] = Math.max(0, G.heroCd[id] - dt);
  G.energy = Math.min(100, G.energy + dt * (G.state === 'wave' ? 1.1 : 0.5));
  if (G.state === 'wave') {
    G.waveT += dt;
    while (G.queue.length && G.queue[0].time <= G.waveT) spawnEnemy(G.queue.shift().t);
    if (G.chestAt > 0 && G.waveT >= G.chestAt) { G.chestAt = -1; spawnChest(); }
    if (!G.queue.length && !G.enemies.some(e => e.alive && !e.illusion)) waveCleared();
  } else if (G.countdown > 0 && G.wave > 0) { G.countdown -= dt; if (G.countdown <= 0) callWave(); }
  updateEnemies(dt); if (G.over) return;
  updateTowers(dt); updateProjectiles(dt);
  for (let i = G.chests.length - 1; i >= 0; i--) { const c = G.chests[i]; c.life -= dt; c.g.rotation.y += dt; c.g.position.y = 0.2 + Math.abs(Math.sin(G.time * 3)) * 0.12; if (c.life <= 0) { root.remove(c.g); G.chests.splice(i, 1); } }
  if (G.weather === 'storm' && G.T.weatherClear <= 0) { G.T.lightning -= 0; if (G.T.lightning <= 0) { G.T.lightning = 6 + rng() * 6; G.flash = 0.15; Sfx.play('thunder'); } }
  if (G.tutorial === 3 && G.enemies.some(e => e.hidden && e.alive)) { G.tutorial = 4; say('dash', 'Vermes escondidos saindo dos túneis! Use minha <b>Visão de Túnel</b> (botão Dash ou tecla 1).', 7); document.querySelector('.hero-btn[data-hero=dash]')?.classList.add('pulse'); }
  if (G.tutorial === 4 && G.T.revealAll > 0) { G.tutorial = 5; document.querySelector('.hero-btn[data-hero=dash]')?.classList.remove('pulse'); }
  if (G.tutorial === 5 && G.wave >= 2 && G.state === 'build') { G.tutorial = 6; say('luna', 'Toque numa torre para <b>melhorá-la</b>. Torres vizinhas certas formam <b>sinergias</b> 🔗 — ex.: Fonte da Vida + Escova.', 7); }
  if (G.tut) tutTick();
  if (G.pendingEco && !G.modalOpen) { G.pendingEco = false; ecoChallenge(); }
}

function runQuiz(opt = {}) {

function skyTexture(stops) {
  const c = document.createElement('canvas'); c.width = 4; c.height = 512; const x = c.getContext('2d'); const g = x.createLinearGradient(0, 0, 0, 512);
  stops.forEach(([o, col]) => g.addColorStop(o, col)); x.fillStyle = g; x.fillRect(0, 0, 4, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
